AWSTemplateFormatVersion: '2010-09-09'
Description: Deploys a VMX3 direct-DID voicemail notifier Lambda. It filters voicemail transcripts by the Connect DID stamped
  in vmx3_notification_number, publishes the transcript to an existing SNS topic, and includes a temporary S3 presigned WAV
  download link. No queue or CloudFront is required.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Amazon Connect and notification settings
      Parameters:
      - FunctionName
      - ConnectInstanceId
      - TargetConnectDid
      - SnsTopicArn
    - Label:
        default: Existing VMX3 storage
      Parameters:
      - TranscriptionBucket
      - RecordingBucket
      - RecordingPrefix
    - Label:
        default: Lambda settings
      Parameters:
      - PresignedUrlExpirationSeconds
      - LambdaTimeout
      - LogRetentionDays
      - TimeZone
    ParameterLabels:
      TargetConnectDid:
        default: Connect DID to notify on
      SnsTopicArn:
        default: Existing SNS topic ARN
      TranscriptionBucket:
        default: Existing VMX3 transcript bucket
      RecordingBucket:
        default: Existing VMX3 recording bucket
Parameters:
  FunctionName:
    Type: String
    Default: VMX3-Direct-DID-Notifier
    Description: Lambda function name. Use a unique name if deploying one notifier per DID.
    AllowedPattern: ^[A-Za-z0-9-_]{1,64}$
  ConnectInstanceId:
    Type: String
    Default: 72df7bd8-0288-45a0-8889-975a0b6f7074
    Description: Amazon Connect instance ID UUID.
  TargetConnectDid:
    Type: String
    Description: Connect phone number that should generate notifications, in E.164 format, for example +12025551234.
    AllowedPattern: ^\+[1-9][0-9]{7,14}$
    ConstraintDescription: Enter the Connect DID in E.164 format, for example +12025551234.
  SnsTopicArn:
    Type: String
    Description: Existing SNS topic ARN whose confirmed email subscriber(s) should receive this DID's voicemail notifications.
  TranscriptionBucket:
    Type: String
    Description: Existing VMX3 transcription S3 bucket name.
  RecordingBucket:
    Type: String
    Description: Existing VMX3 voicemail recording S3 bucket name.
  RecordingPrefix:
    Type: String
    Default: ''
    Description: Optional S3 key prefix for VMX3 WAV recordings. Leave blank if not needed.
  PresignedUrlExpirationSeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    MaxValue: 21600
    Description: Requested S3 presigned WAV URL lifetime. Default is 1 hour. Actual lifetime cannot exceed the Lambda role's
      temporary credentials.
  LambdaTimeout:
    Type: Number
    Default: 120
    MinValue: 30
    MaxValue: 300
    Description: Lambda timeout in seconds.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
    - 1
    - 3
    - 5
    - 7
    - 14
    - 30
    - 60
    - 90
    - 120
    - 150
    - 180
    - 365
    - 400
    - 545
    - 731
    Description: CloudWatch Logs retention in days.
  TimeZone:
    Type: String
    Default: America/New_York
    Description: IANA time zone used in the SNS message timestamp.
Resources:
  NotifierExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName:
          Fn::Sub: ${FunctionName}-Policy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*
          - Sid: ReadTranscriptObjects
            Effect: Allow
            Action:
            - s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${TranscriptionBucket}/*
          - Sid: ReadRecordingObjects
            Effect: Allow
            Action:
            - s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${RecordingBucket}/*
          - Sid: ListRecordingBucket
            Effect: Allow
            Action:
            - s3:ListBucket
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${RecordingBucket}
          - Sid: PublishNotification
            Effect: Allow
            Action:
            - sns:Publish
            Resource:
              Ref: SnsTopicArn
          - Sid: ReadConnectContactData
            Effect: Allow
            Action:
            - connect:DescribeContact
            - connect:GetContactAttributes
            Resource: '*'
      Tags:
      - Key: Application
        Value: VMX3
      - Key: Purpose
        Value: DirectDIDVoicemailNotification
      - Key: Environment
        Value: Production
  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${FunctionName}
      RetentionInDays:
        Ref: LogRetentionDays
  NotifierFunction:
    Type: AWS::Lambda::Function
    DependsOn:
    - NotifierLogGroup
    Properties:
      FunctionName:
        Ref: FunctionName
      Description: Publishes VMX3 direct-DID voicemail transcripts and temporary S3 WAV links to SNS.
      Runtime: python3.12
      Handler: index.lambda_handler
      Architectures:
      - x86_64
      Role:
        Fn::GetAtt:
        - NotifierExecutionRole
        - Arn
      Timeout:
        Ref: LambdaTimeout
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.parse import unquote_plus
          from zoneinfo import ZoneInfo

          import boto3
          from botocore.exceptions import ClientError

          CONNECT_INSTANCE_ID = os.environ["CONNECT_INSTANCE_ID"]
          TARGET_CONNECT_DID = os.environ["TARGET_CONNECT_DID"]
          SNS_TOPIC_ARN = os.environ["SNS_TOPIC_ARN"]
          TRANSCRIPTION_BUCKET = os.environ["TRANSCRIPTION_BUCKET"]
          RECORDING_BUCKET = os.environ["RECORDING_BUCKET"]
          RECORDING_PREFIX = os.environ.get("RECORDING_PREFIX", "")
          PRESIGNED_URL_EXPIRATION = int(os.environ.get("PRESIGNED_URL_EXPIRATION", "3600"))
          VMX3_PREFIX = os.environ.get("VMX3_PREFIX", "vmx3_")
          TIME_ZONE = os.environ.get("TIME_ZONE", "America/New_York")

          s3 = boto3.client("s3")
          sns = boto3.client("sns")
          connect = boto3.client("connect")

          RETRY_DELAYS = [2, 4, 8, 12, 15]
          RECORDING_RETRY_DELAYS = [2, 4, 6]


          def _normalize_phone(value):
              if not value:
                  return ""
              return "".join(ch for ch in str(value) if ch.isdigit())


          def _get_contact_id_from_job_name(job_name):
              if job_name.startswith(VMX3_PREFIX):
                  return job_name[len(VMX3_PREFIX):]
              return job_name


          def _describe_contact_with_retry(contact_id):
              for attempt, delay in enumerate(RETRY_DELAYS, start=1):
                  try:
                      response = connect.describe_contact(
                          InstanceId=CONNECT_INSTANCE_ID,
                          ContactId=contact_id,
                      )
                      return response.get("Contact", {}) or {}
                  except ClientError as exc:
                      code = exc.response.get("Error", {}).get("Code", "")
                      print(f"DescribeContact attempt {attempt} failed for {contact_id}: {code} - {exc}")
                      if code != "ResourceNotFoundException":
                          return {}
                      if attempt < len(RETRY_DELAYS):
                          time.sleep(delay)
                  except Exception as exc:
                      print(f"DescribeContact unexpected error for {contact_id}: {exc}")
                      return {}
              return {}


          def _get_attributes_with_retry(contact, contact_id):
              initial_contact_id = contact.get("InitialContactId") or contact_id
              for attempt, delay in enumerate(RETRY_DELAYS, start=1):
                  try:
                      response = connect.get_contact_attributes(
                          InstanceId=CONNECT_INSTANCE_ID,
                          InitialContactId=initial_contact_id,
                      )
                      return response.get("Attributes", {}) or {}
                  except ClientError as exc:
                      code = exc.response.get("Error", {}).get("Code", "")
                      print(f"GetContactAttributes attempt {attempt} failed for {contact_id}: {code} - {exc}")
                      if code != "ResourceNotFoundException":
                          return {}
                      if attempt < len(RETRY_DELAYS):
                          time.sleep(delay)
                  except Exception as exc:
                      print(f"GetContactAttributes unexpected error for {contact_id}: {exc}")
                      return {}
              return {}


          def _extract_transcript_text(data):
              try:
                  return data["results"]["transcripts"][0]["transcript"].strip()
              except (KeyError, IndexError, TypeError, AttributeError):
                  return ""


          def _find_recording_key_once(contact_id):
              paginator = s3.get_paginator("list_objects_v2")
              params = {"Bucket": RECORDING_BUCKET}
              if RECORDING_PREFIX:
                  params["Prefix"] = RECORDING_PREFIX

              matches = []
              for page in paginator.paginate(**params):
                  for item in page.get("Contents", []):
                      key = item.get("Key", "")
                      if contact_id in key and key.lower().endswith(".wav"):
                          matches.append(item)

              if not matches:
                  return None

              newest = max(matches, key=lambda item: item["LastModified"])
              return newest["Key"]


          def _find_recording_key(contact_id):
              for attempt in range(len(RECORDING_RETRY_DELAYS) + 1):
                  try:
                      key = _find_recording_key_once(contact_id)
                      if key:
                          print(f"Recording located for {contact_id}: s3://{RECORDING_BUCKET}/{key}")
                          return key
                  except Exception as exc:
                      print(f"Recording search failed for {contact_id}: {exc}")
                      return None

                  if attempt < len(RECORDING_RETRY_DELAYS):
                      delay = RECORDING_RETRY_DELAYS[attempt]
                      print(f"Recording not found yet for {contact_id}; retrying in {delay} seconds")
                      time.sleep(delay)

              print(f"No WAV recording found for contact {contact_id}")
              return None


          def _generate_recording_url(contact_id):
              key = _find_recording_key(contact_id)
              if not key:
                  return None

              try:
                  return s3.generate_presigned_url(
                      ClientMethod="get_object",
                      Params={
                          "Bucket": RECORDING_BUCKET,
                          "Key": key,
                          "ResponseContentDisposition": f'attachment; filename="VMX3-Voicemail-{contact_id}.wav"',
                          "ResponseContentType": "audio/wav",
                      },
                      ExpiresIn=PRESIGNED_URL_EXPIRATION,
                  )
              except Exception as exc:
                  print(f"Failed generating recording URL for {contact_id}: {exc}")
                  return None


          def lambda_handler(event, context):
              processed = 0
              published = 0
              skipped = 0
              failed = 0

              for record in event.get("Records", []):
                  processed += 1

                  if record.get("eventSource") != "aws:s3":
                      skipped += 1
                      continue

                  bucket = record.get("s3", {}).get("bucket", {}).get("name", "")
                  key = unquote_plus(record.get("s3", {}).get("object", {}).get("key", ""))

                  if bucket != TRANSCRIPTION_BUCKET:
                      print(f"Skipping unexpected bucket: {bucket}")
                      skipped += 1
                      continue

                  if not key.lower().endswith(".json"):
                      print(f"Skipping non-JSON object: s3://{bucket}/{key}")
                      skipped += 1
                      continue

                  try:
                      response = s3.get_object(Bucket=bucket, Key=key)
                      data = json.loads(response["Body"].read().decode("utf-8"))
                  except Exception as exc:
                      print(f"Failed to load/parse s3://{bucket}/{key}: {exc}")
                      failed += 1
                      continue

                  job_name = data.get("jobName", "")
                  contact_id = _get_contact_id_from_job_name(job_name)
                  if not contact_id:
                      print(f"Could not resolve contact ID from jobName '{job_name}'")
                      skipped += 1
                      continue

                  contact = _describe_contact_with_retry(contact_id)
                  attributes = _get_attributes_with_retry(contact, contact_id)

                  connect_did = (
                      attributes.get("vmx3_notification_number")
                      or contact.get("SystemEndpoint", {}).get("Address")
                      or ""
                  )

                  if _normalize_phone(connect_did) != _normalize_phone(TARGET_CONNECT_DID):
                      print(f"Skipping contact {contact_id}; DID '{connect_did}' does not match '{TARGET_CONNECT_DID}'")
                      skipped += 1
                      continue

                  transcript = _extract_transcript_text(data)
                  if not transcript or transcript.lower().startswith("transcription failed"):
                      transcript = "Transcript unavailable. Please use the recording link below."

                  recording_url = _generate_recording_url(contact_id)
                  caller = contact.get("CustomerEndpoint", {}).get("Address") or attributes.get("CallerNumber") or "Unknown"

                  ts_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
                  try:
                      ts_local = datetime.now(ZoneInfo(TIME_ZONE)).strftime("%Y-%m-%d %I:%M:%S %p %Z")
                  except Exception:
                      ts_local = ts_utc

                  if recording_url:
                      recording_section = (
                          "-------------------------------------------\n"
                          " Recording Download\n"
                          "-------------------------------------------\n"
                          f"{recording_url}\n\n"
                          f"This temporary recording link is configured for {PRESIGNED_URL_EXPIRATION} seconds.\n\n"
                      )
                  else:
                      recording_section = (
                          "-------------------------------------------\n"
                          " Recording Download\n"
                          "-------------------------------------------\n"
                          "The recording link could not be generated.\n\n"
                      )

                  message = (
                      "===========================================\n"
                      " VMX3 Direct Voicemail Notification\n"
                      "===========================================\n\n"
                      f"Connect Number: {connect_did}\n"
                      f"Caller: {caller}\n"
                      f"Timestamp: {ts_local}  ({ts_utc})\n\n"
                      f"{recording_section}"
                      "-------------------------------------------\n"
                      " Transcript\n"
                      "-------------------------------------------\n"
                      f"{transcript}\n"
                  )

                  try:
                      sns.publish(
                          TopicArn=SNS_TOPIC_ARN,
                          Subject=f"New VMX3 Voicemail - {connect_did}",
                          Message=message,
                      )
                      published += 1
                      print(f"SNS publish successful for contact {contact_id}")
                  except Exception as exc:
                      failed += 1
                      print(f"SNS publish failed for contact {contact_id}: {exc}")

              result = {
                  "status": "ok",
                  "processed": processed,
                  "published": published,
                  "skipped": skipped,
                  "failed": failed,
              }
              print(json.dumps(result))
              return result
      Environment:
        Variables:
          CONNECT_INSTANCE_ID:
            Ref: ConnectInstanceId
          TARGET_CONNECT_DID:
            Ref: TargetConnectDid
          SNS_TOPIC_ARN:
            Ref: SnsTopicArn
          TRANSCRIPTION_BUCKET:
            Ref: TranscriptionBucket
          RECORDING_BUCKET:
            Ref: RecordingBucket
          RECORDING_PREFIX:
            Ref: RecordingPrefix
          PRESIGNED_URL_EXPIRATION:
            Ref: PresignedUrlExpirationSeconds
          TIME_ZONE:
            Ref: TimeZone
          VMX3_PREFIX: vmx3_
      Tags:
      - Key: Application
        Value: VMX3
      - Key: Purpose
        Value: DirectDIDVoicemailNotification
      - Key: Environment
        Value: Production
  AllowTranscriptionBucketInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: NotifierFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:s3:::${TranscriptionBucket}
Outputs:
  LambdaFunctionName:
    Description: Deployed Lambda function name.
    Value:
      Ref: NotifierFunction
  LambdaFunctionArn:
    Description: Deployed Lambda function ARN.
    Value:
      Fn::GetAtt:
      - NotifierFunction
      - Arn
  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN.
    Value:
      Fn::GetAtt:
      - NotifierExecutionRole
      - Arn
  TargetConnectDid:
    Description: Connect DID this stack filters on.
    Value:
      Ref: TargetConnectDid
  ManualNextStep:
    Description: Required after deployment because the VMX3 transcript bucket already exists outside this stack.
    Value:
      Fn::Sub: Add an S3 ObjectCreated event notification on ${TranscriptionBucket} with suffix .json targeting Lambda ${FunctionName}.

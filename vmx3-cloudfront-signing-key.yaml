AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager secret containing the VMX3 CloudFront signed-URL RSA private key

Parameters:
  SecretName:
    Type: String
    Default: VMX3CloudFrontSigningKey
    Description: Name of the Secrets Manager secret.

  PrivateKeyPem:
    Type: String
    NoEcho: true
    Description: Full PEM-encoded RSA private key used to sign VMX3 CloudFront URLs.

Resources:
  VMX3CloudFrontSigningKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      Description: VMX3 CloudFront signed-URL RSA private signing key
      SecretString: !Ref PrivateKeyPem
      Tags:
        - Key: App
          Value: VMX3
        - Key: Purpose
          Value: CloudFrontSignedURLs
        - Key: Department
          Value: OIEA

Outputs:
  CloudFrontSigningKeySecretArn:
    Description: ARN of the VMX3 CloudFront signing-key secret
    Value: !Ref VMX3CloudFrontSigningKey

  CloudFrontSigningKeySecretName:
    Description: Name of the VMX3 CloudFront signing-key secret
    Value: !Ref SecretName

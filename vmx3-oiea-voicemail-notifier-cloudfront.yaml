AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deploys the OIEA VMX3 voicemail notifier Lambda with SNS delivery and
  30-day CloudFront signed WAV URLs. The existing VMX3 recording bucket
  policy is intentionally not managed by this stack.

Parameters:
  FunctionName:
    Type: String
    Default: VMX3-OIEA-Voicemail-Notifier

  CodeBucket:
    Type: String
    Default: vmx3-artifacts-code-prd

  CodeKey:
    Type: String
    Default: lambda/vmx3-oiea-voicemail-notifier.zip

  ConnectInstanceId:
    Type: String
    Description: Amazon Connect instance ID UUID.

  SnsTopicArn:
    Type: String
    Description: Existing SNS topic ARN for OIEA voicemail notifications.

  TranscriptionBucket:
    Type: String
    Description: Existing VMX3 transcription bucket name.

  RecordingBucket:
    Type: String
    Description: Existing private VMX3 recording bucket name.

  RecordingPrefix:
    Type: String
    Default: ''

  QueueName:
    Type: String
    Default: OIEA

  CloudFrontPublicKeyPem:
    Type: String
    NoEcho: true
    Description: PEM-encoded RSA public key corresponding to the private signing key.

  CloudFrontPrivateKeySecretArn:
    Type: String
    Description: Secrets Manager secret ARN containing the matching PEM-encoded RSA private key.

  CloudFrontUrlExpirationSeconds:
    Type: Number
    Default: 2592000
    MinValue: 60
    MaxValue: 31536000
    Description: Default 2592000 seconds = 30 days.

  LambdaTimeout:
    Type: Number
    Default: 120
    MinValue: 10
    MaxValue: 900

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653

Resources:
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${FunctionName}-OAC'
        Description: OAC for private VMX3 recording bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub '${AWS::StackName}-${AWS::AccountId}'
        Comment: OIEA VMX3 signed URL public key
        EncodedKey: !Ref CloudFrontPublicKeyPem
        Name: !Sub '${FunctionName}-PublicKey'

  CloudFrontKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Comment: OIEA VMX3 signed URL key group
        Items:
          - !Ref CloudFrontPublicKey
        Name: !Sub '${FunctionName}-KeyGroup'

  RecordingDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: OIEA VMX3 private voicemail recording distribution
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: RecordingBucketOrigin
            DomainName: !Sub '${RecordingBucket}.s3.${AWS::Region}.${AWS::URLSuffix}'
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: RecordingBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: false
          TrustedKeyGroups:
            - !Ref CloudFrontKeyGroup
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  NotifierExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${FunctionName}-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${FunctionName}-Policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*'

              - Sid: ReadTranscriptObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${TranscriptionBucket}/*'

              - Sid: ReadRecordingObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${RecordingBucket}/*'

              - Sid: ListRecordingBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${RecordingBucket}'

              - Sid: PublishNotification
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SnsTopicArn

              - Sid: ReadConnectContactData
                Effect: Allow
                Action:
                  - connect:DescribeContact
                  - connect:DescribeQueue
                  - connect:GetContactAttributes
                Resource: '*'

              - Sid: ReadCloudFrontPrivateSigningKey
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref CloudFrontPrivateKeySecretArn

  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FunctionName}'
      RetentionInDays: !Ref LogRetentionDays

  NotifierFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - NotifierLogGroup
      - RecordingDistribution
    Properties:
      FunctionName: !Ref FunctionName
      Description: Sends OIEA voicemail transcripts and 30-day CloudFront signed WAV URLs through SNS.
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      Role: !GetAtt NotifierExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
          SNS_TOPIC_ARN: !Ref SnsTopicArn
          TRANSCRIPTION_BUCKET: !Ref TranscriptionBucket
          RECORDING_BUCKET: !Ref RecordingBucket
          RECORDING_PREFIX: !Ref RecordingPrefix
          QUEUE_NAME_FILTER: !Ref QueueName
          CLOUDFRONT_DOMAIN: !GetAtt RecordingDistribution.DomainName
          CLOUDFRONT_KEY_PAIR_ID: !Ref CloudFrontPublicKey
          CLOUDFRONT_PRIVATE_KEY_SECRET_ARN: !Ref CloudFrontPrivateKeySecretArn
          CLOUDFRONT_URL_EXPIRATION: !Sub '${CloudFrontUrlExpirationSeconds}'
          TIME_ZONE: America/New_York
          VMX3_PREFIX: vmx3_
      Tags:
        - Key: Application
          Value: VMX3
        - Key: Department
          Value: OIEA
        - Key: Environment
          Value: Production

  AllowTranscriptionBucketInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotifierFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${TranscriptionBucket}'

Outputs:
  LambdaFunctionName:
    Value: !Ref NotifierFunction

  LambdaFunctionArn:
    Value: !GetAtt NotifierFunction.Arn

  LambdaExecutionRoleArn:
    Value: !GetAtt NotifierExecutionRole.Arn

  CloudFrontDistributionId:
    Value: !Ref RecordingDistribution

  CloudFrontDistributionArn:
    Value: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${RecordingDistribution}'

  CloudFrontDomainName:
    Value: !GetAtt RecordingDistribution.DomainName

  CloudFrontPublicKeyId:
    Value: !Ref CloudFrontPublicKey

  RecordingBucketPolicyStatement:
    Description: Add an equivalent statement to the EXISTING VMX3 recording bucket policy.
    Value: !Sub >
      Allow cloudfront.amazonaws.com s3:GetObject on
      arn:${AWS::Partition}:s3:::${RecordingBucket}/*
      when AWS:SourceArn equals
      arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${RecordingDistribution}

  ManualS3TriggerStep:
    Value: Add an ObjectCreated event notification with suffix .json on the transcription bucket targeting this Lambda.

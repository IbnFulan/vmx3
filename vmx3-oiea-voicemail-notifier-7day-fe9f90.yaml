AWSTemplateFormatVersion: '2010-09-09'
Description: Deploys the OIEA VMX3 voicemail notifier Lambda with SNS delivery and 7-day S3 presigned WAV download links.

Parameters:
  FunctionName:
    Type: String
    Default: VMX3-OIEA-Voicemail-Notifier
  CodeBucket:
    Type: String
    Default: vmx3-artifacts-code-prd
  CodeKey:
    Type: String
    Default: lambda/vmx3-oiea-voicemail-notifier.zip
  ConnectInstanceId:
    Type: String
  SnsTopicArn:
    Type: String
  TranscriptionBucket:
    Type: String
  RecordingBucket:
    Type: String
  RecordingPrefix:
    Type: String
    Default: ''
  QueueName:
    Type: String
    Default: OIEA
  PresignedUrlExpiration:
    Type: Number
    Default: 604800
    MinValue: 60
    MaxValue: 604800
  LambdaTimeout:
    Type: Number
    Default: 120
    MinValue: 10
    MaxValue: 900
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1,3,5,7,14,30,60,90,120,150,180,365,400,545,731,1096,1827,2192,2557,2922,3288,3653]

Resources:
  NotifierExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${FunctionName}-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: [sts:AssumeRole]
      Policies:
        - PolicyName: !Sub '${FunctionName}-Policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*'
              - Sid: ReadTranscriptObjects
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${TranscriptionBucket}/*'
              - Sid: ReadRecordingObjects
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${RecordingBucket}/*'
              - Sid: ListRecordingBucket
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${RecordingBucket}'
              - Sid: PublishNotification
                Effect: Allow
                Action: [sns:Publish]
                Resource: !Ref SnsTopicArn
              - Sid: ReadConnectContactData
                Effect: Allow
                Action:
                  - connect:DescribeContact
                  - connect:DescribeQueue
                  - connect:GetContactAttributes
                Resource: '*'

  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FunctionName}'
      RetentionInDays: !Ref LogRetentionDays

  NotifierFunction:
    Type: AWS::Lambda::Function
    DependsOn: NotifierLogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Description: Sends OIEA voicemail transcripts and 7-day S3 presigned WAV download links through SNS.
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures: [x86_64]
      Role: !GetAtt NotifierExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
          SNS_TOPIC_ARN: !Ref SnsTopicArn
          TRANSCRIPTION_BUCKET: !Ref TranscriptionBucket
          RECORDING_BUCKET: !Ref RecordingBucket
          RECORDING_PREFIX: !Ref RecordingPrefix
          QUEUE_NAME_FILTER: !Ref QueueName
          PRESIGNED_URL_EXPIRATION: !Sub '${PresignedUrlExpiration}'
          TIME_ZONE: America/New_York
          VMX3_PREFIX: vmx3_
      Tags:
        - Key: Application
          Value: VMX3
        - Key: Department
          Value: OIEA
        - Key: Environment
          Value: Production

  AllowTranscriptionBucketInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotifierFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${TranscriptionBucket}'

Outputs:
  LambdaFunctionName:
    Value: !Ref NotifierFunction
  LambdaFunctionArn:
    Value: !GetAtt NotifierFunction.Arn
  ManualNextStep:
    Value: Add an S3 ObjectCreated event notification with suffix .json on the transcription bucket targeting this Lambda.
